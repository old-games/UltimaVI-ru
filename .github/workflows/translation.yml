name: Translation

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  translation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip3 install poetry
        poetry config virtualenvs.create false
        poetry install --no-root

    - name: Test conversations
      run: python3 -m unittest tests.test_conversation.TestConversation.testUser

    - name: Test book
      # FIXME Run tests by tags
      run: python3 -m unittest tests.test_book

    - name: Test look
      run: python3 -m unittest tests.test_look

    - name: Test translations
      run: python3 -m unittest tests.test_translation

    - name: Test import from the translation system
      run: python3 -m unittest tests.test_sp

    - name: Test installation in the build
      run: python3 -m unittest tests.test_setup

    - name: Check with `duplicates`
      run: python3 -m tools.duplicates

    - name: Test save editor
      run: node web/save/test.js
